[project]
name = "parametric-flight-insurance"
version = "0.1.0"
description = "ParametricFlightInsurance — GenLayer Intelligent Contract for automatic parametric flight-delay insurance settlement using Comparative Equivalence Principle consensus."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "cloudpickle==3.1.1",
    "genlayer-py>=0.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
