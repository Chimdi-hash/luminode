[project]
name = "luminode"
version = "0.1.0"
description = "LumiNode — AI-Powered performance auditing and metric verification for Web3 nodes, powered by GenLayer's Optimistic Democracy."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["contract"]

[tool.ruff]
line-length = 120
target-version = "py311"
